name: send test alert

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pyyaml
      - name: Send test alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m vol_wheel.alerts --test
