name: tests

on:
  push:
    paths: ["vol_wheel/**", "tests/**", "config/**", "requirements*.txt", ".github/workflows/tests.yml"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pandas numpy pyyaml requests pytest
      - run: python -m pytest -q
