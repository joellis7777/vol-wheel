# vol-wheel rulebook in config form. Every threshold the scanner uses lives here.
# Edit, commit, and the next scan picks it up. Percent values are written as
# whole percents unless the key ends in _frac (0.05 = 5%).

bull_mode: true            # manual switch; LEAP buys also need SPY > SMA200

universe:
  # bucket: {cap: % of account, core: [...], opportunistic: [...]}
  Index:      {cap: 25, core: [QQQ, SPY], opportunistic: []}
  Crypto:     {cap: 20, core: [IBIT],    opportunistic: [MSTR]}
  AI semis:   {cap: 15, core: [NVDA],    opportunistic: [MRVL]}
  Platform:   {cap: 15, core: [GOOG],    opportunistic: [AMZN]}
  High-beta:  {cap: 15, core: [TSLA],    opportunistic: [HOOD, SOFI]}
  Power:      {cap: 10, core: [CEG],     opportunistic: []}
  Hard asset: {cap: 10, core: [GLD],     opportunistic: [FNV]}   # gold royalty, added 2026-10-09 (RGLD removed same day: illiquid)

total_deployed_cap: 80       # % of account across all buckets
# VIX-scaled total cap (tastytrade: deploy more when volatility is high). [VIX at/above, cap % of
# account in put collateral + shares]. Built 2026-10-11 for testing in the backtest (variants with
# vix_caps: true); not yet the live rule: total_deployed_cap above still applies.
deployment:
  vix_caps: [[0, 40], [15, 55], [20, 70], [30, 80]]
per_name_cap: 15             # % of account per single name
per_name_cap_index: 25       # % of account for index names (SPY, QQQ)

# Index ETFs whose IV rank comes from a volatility index until our own history is long enough.
vol_index_proxy:
  SPY: _VIX
  QQQ: _VXN

# Names that trade with bitcoin over the weekend: ladder spacing uses the larger
# of the IV-based and HV-based expected move.
weekend_gap_names: [IBIT, MSTR]
# Momentum names: cover at most this % of shares/LEAPs with short calls.
momentum_names: [TSLA, MSTR, HOOD, NVDA, IBIT]
momentum_max_call_coverage: 50

iv_rank:
  lookback_days: 252        # 52 weeks of trading days
  min_history_days: 60      # true IVR from our own iv30 history once this many days exist
  full_history_days: 252    # below this, IVR is labelled "partial"
  proxy_hv_window: 20       # proxy = percentile of HV20 over the lookback

thresholds:
  ivr_no_short: 30          # IVR below this: no new short premium
  ivr_sell: 50              # IVR at/above this: sell premium on a spike
  ivr_both_sides: 70        # Mid regime + IVR at/above this: 10-delta call may sit alongside a put
  both_sides_call_delta: 10
  min_iv_hv_ratio: 1.15     # SELL PUT / SELL CALL also need iv30 >= 1.15 x HV20 (premium rich vs realized)
  # Measure that HV20 on the 20 days before the last spike_max_days (decided 2026-10-09). Otherwise a
  # big move inflates its own realized vol and fails the check: CEG +13% on 2026-10-06 took HV20
  # from 41% to 61%, so IV 49% read 0.80x instead of 1.20x.
  iv_hv_pre_move: true
  spike_sigma: 1.5          # move / (sigma_daily * sqrt(k)) needed for a spike
  spike_max_days: 3         # k = 1..N
  spike_hv_window: 20       # sigma_daily = HV20 (measured before the window) * price / sqrt(252)

regime:
  sma_window: 200
  lookback_days: 756        # ~3 years (or whatever exists)
  min_days: 60              # need at least this many SMA200 ratios
  low_below: 20             # extension percentile < 20 -> Low
  high_above: 80            # extension percentile > 80 -> High

consolidation:
  bb_window: 20
  bb_std: 2.0
  bb_lookback_days: 252
  bb_pct_max: 25            # BB width in the bottom 25% of the past year
  ivr_max: 25
  range_window: 50          # range position within the 50-day high-low

leap:
  core_only: true           # opportunistic names are spike-only
  ivr_max: 25
  range_pos_max: 0.3333     # bottom third of the 50-day range
  regimes: [Low, Mid]
  min_dte: 365              # default window (IRA variant); see variants below
  max_dte: 548
  # Two LEAP candidates per name. Taxable LEAPs are held >1 year for long-term gains and never have
  # calls sold against them (tax-straddle rules); the IRA wheel can sell calls against its LEAPs.
  variants:
    ira:     {min_dte: 365, max_dte: 548, label: "IRA · 12–18 months", note: "calls may be sold against it"}
    # min 487 DTE = held >1 year and still out by the 120-DTE roll/close rule. If nothing is listed
    # 16-18 months out (common: LEAPs list Jan plus a few other months), show the nearest expiry up
    # to fallback_max_dte, flagged.
    taxable: {min_dte: 487, max_dte: 548, fallback_max_dte: 760, label: "Taxable · 16–18 months", note: "hold >1 year, don't sell calls against"}
  delta_min: 70
  delta_max: 80
  max_spread_pct: 15        # LEAP spreads are wider; % of mid
  max_spread_abs: 0.50
  min_open_interest: 10

strikes:
  dte_min: 35
  dte_max: 50
  dte_target: 45
  prefer_monthly: true
  # target deltas (whole delta points) by regime
  put_delta:  {Low: 30, Mid: 20, High: 10}
  call_delta: {Low: 10, Mid: 20, High: 30}
  delta_band: 7
  max_spread_pct: 10        # spread <= 10% of mid ...
  max_spread_abs: 0.10      # ... or <= $0.10
  # When nothing in the band passes the spread rule (thin names: CEG, FNV, RGLD), still show the
  # best strikes whose spread is <= wide_spread_max_pct of mid, flagged "wide market: place a limit
  # near the mid" (decided 2026-10-09). Other filters still apply.
  wide_spread_fallback: true
  wide_spread_max_pct: 40
  min_open_interest: 100
  put_min_credit_pct_high_delta: 1.0   # puts >= 20 delta need mid >= 1% of strike
  put_min_credit_pct_low_delta: 0.3    # puts < 20 delta need mid >= 0.3% of strike
  put_high_delta_cutoff: 20
  top_n: 3
  min_strike_gap_pct: 0.5   # top picks must be at least 0.5% of price apart

  weights:
    support: 0.30
    richness: 0.25
    roc: 0.20
    cushion: 0.15
    assignment: 0.10

  support:
    ideal_min_pct: 0.5      # strike 0.5-3% beyond a level scores 1
    ideal_max_pct: 3.0
    fade_to_pct: 8.0        # fading to 0 at 8%
    penalty_zone_pct: 2.0   # strike within 2% on the wrong side of a level ...
    penalty: 0.5            # ... loses this much
    swing_lookback_days: 120
    swing_order: 5          # bars each side for a swing high/low
    round_step_frac: 0.05   # round-number step ~ 5% of price, snapped to 1/2/2.5/5 x 10^n
    oi_wall_max_dte: 60     # open interest summed over expiries up to this DTE
    level_range_pct: 25     # only levels within 25% of price count
    # strength of each level type (multiplies its score and its penalty)
    strength: {sma50: 0.9, sma100: 0.9, sma200: 1.0, swing: 1.0, round: 0.7, oi_wall: 0.9}

  richness:
    resid_floor_pts: -2.0   # IV residual vs skew fit (vol points) mapped to 0..1
    resid_cap_pts: 3.0
    iv_hv_floor: 0.8        # IV / HV20 mapped to 0..1
    iv_hv_cap: 1.5
    resid_weight: 0.5       # share of richness from the skew residual (rest from IV/HV)
    fit_delta_min: 5        # skew curve is fit on OTM quotes between these deltas
    fit_delta_max: 60

  cushion:
    full_score_moves: 1.5

  assignment:
    near_pct: 1.0           # breakeven within 1% above SMA200 / swing low still scores 1
    fade_to_pct: 10.0
    swing_lookback_days: 252

# Rulebook trade management, quoted in each "Suggested trade" line.
management:
  take_profit_pct: 50       # close winners at 50% of the credit
  decide_dte: 21            # decide every open short by 21 DTE

sizing:
  tiers: [25000, 50000, 150000, 500000, 1000000]
  default_tier: 500000
  entry_pct: 5              # each ladder entry ~5% of the account
  ladder_rungs: 3           # up to 3 rungs per name per side
  ladder_dte: 45            # rung spacing = 1 and 2 forty-five-day expected moves

data:
  cboe_chain_url: https://cdn.cboe.com/api/global/delayed_quotes/options/{sym}.json
  cboe_history_url: https://cdn.cboe.com/api/global/delayed_quotes/charts/historical/{sym}.json
  timeout_s: 30
  retries: 3
  history_min_days: 220     # fall back to yfinance if CBOE gives fewer daily bars than this

schedule:
  timezone: America/New_York
  close_cron: "35 21 * * 1-5"   # must match the post-close cron in .github/workflows/scan.yml
  intraday_slots: ["10:30", "15:30"]   # ET; each has two UTC crons (EDT and EST), the script keeps the one that matches
  slot_window_before_min: 20    # a scheduled run counts for a slot from 20 min before ...
  slot_window_after_min: 55     # ... to 55 min after it (GitHub cron can start late)
  market_open: "09:30"
  market_close: "16:00"

alerts:
  enabled: true
  ntfy_server: https://ntfy.sh  # topic comes from the NTFY_TOPIC repo secret, never from here
  dashboard_url: https://joellis7777.github.io/vol-wheel/
  triggers: [SELL_PUT, SELL_CALL, LEAP_BUY, PAIR_CALL, EARNINGS_PLAY, HEDGE]
  sizing_tier: 500000           # CSP eligibility in the message is shown for this account size
  max_rungs: 3                  # re-alert when price reaches rung 2 and 3 (1 and 2 expected moves past the last alerted strike)
  daily_digest: true            # one low-priority post-close message listing WATCH names
  priority: {trigger: high, upgrade_from_watch: default, digest: low, hedge: default}
  tags:
    SELL_PUT: chart_with_downwards_trend
    SELL_CALL: chart_with_upwards_trend
    PAIR_CALL: chart_with_upwards_trend
    LEAP_BUY: seedling
    EARNINGS_PLAY: date
    HEDGE: shield
    DIGEST: eyes

earnings:
  # Single stocks only; these have no earnings.
  etfs: [SPY, QQQ, IBIT, GLD]
  nasdaq_url: https://api.nasdaq.com/api/analyst/{sym}/earnings-date
  cache_path: data/earnings.json
  iv_window_days: 30        # earnings within this many days inflate iv30 -> strip the implied move
  min_term_gap_days: 5      # second expiry must be at least this much later than the first post-earnings one
  min_move: 0.005           # a term-structure jump below 0.5% = no earnings bump (iv30 used as-is)
  straddle_max_days_after: 7  # straddle/price stands in for the move only if the term structure can't be read,
  straddle_max_dte: 14        # E1 expires within 7 days of the reaction and within 14 days of today
  # EARNINGS PLAY: pre-earnings directional sale (rulebook "earnings mode")
  play_min_days: 1          # earnings at least 1 day away ...
  play_max_days: 21         # ... and at most 21 days away
  play_delta_min: 10
  play_delta_max: 15
  play_move_mult: 1.5       # strike outside 1.5x the implied earnings move
  play_size_frac: 0.5       # half size
  trend_days: 5             # call after a run-up / put after a sell-off, by the 5-day return ...
  trend_sigma: 1.0          # ... of at least 1.0 x HV20 * sqrt(5/252)
  gap_mult: 1.5             # post-earnings move >= 1.5x the implied move counts as a normal spike
  # When earnings fall before the usual 35-50 DTE expiry, trade the latest expiry that ends before
  # the report instead of pausing the wheel (normal deltas, sizes and signals). Off = pause.
  pre_earnings_expiry:
    enabled: true
    min_dte: 21             # shortest expiry worth selling (the rulebook's 21-DTE decision point)
    max_dte: 34             # anything 35+ is already the normal window
    prefer_monthly: false   # weeklies are fine; take the latest expiry before the report
    # Management (decided 2026-10-09): close at this % of the credit or hold to expiry. The 21-DTE
    # decision rule doesn't apply (expiring before the report is the point); never roll past it.
    take_profit_pct: 50

# Optional crash-hedge card + alert (rulebook: no standing hedge; this is the opportunistic one).
hedge_alerts: false
hedge:
  symbols: [SPY, QQQ]
  vix_max: 14               # VIX below this ...
  spy_regime: High          # ... and SPY in this regime
  min_dte: 90
  max_dte: 120
  target_dte: 105
  otm_pcts: [10, 15]        # one candidate per % out of the money

# Backtest (python -m vol_wheel.backtest; workflow "backtest", manual). Signals, deltas, management,
# sizing and caps come from the sections above; these knobs only describe the simulation.
backtest:
  account: 500000
  calendar_symbol: SPY
  dte: 45
  min_history_days: 260     # a name joins the basket once it has ~1 year of bars
  cash_yield_symbol: _IRX   # 13-week T-bill yield (Yahoo ^IRX); cash and put collateral earn it
  cash_yield_fallback_pct: 2.0
  # Implied vol: CBOE volatility indexes where they exist (true IV rank + the IV/HV gate) ...
  vol_index: {QQQ: _VXN, SPY: _VIX, GLD: _GVZ}
  vol_index_atm_ratio: 0.9  # VIX-style indexes sit above ATM IV; price options at 0.9 x the index
  # ... otherwise IV = mult x max(HV20, HV60), an assumption; run at several values as a sensitivity.
  stock_iv_mult: 1.15
  stock_iv_mults: [1.0, 1.15, 1.3]
  stock_iv_hv_long: 60
  skew_slope: {index: 0.8, stock: 0.3}   # iv(K) = atm - slope * ln(K/S)
  costs: {per_contract: 0.65, slippage_pct_index: 2, slippage_pct_stock: 5}   # % of mid per fill
  decide_itm: hold          # ITM at 21 DTE: hold to expiry and take assignment ("roll" = roll same strike out once)
  max_rolls: 1
  data_start: "2006-01-03"   # CBOE's pre-2006 stock bars have bad jumps (NVDA +182% on 2006-01-03); ignore them
  listing_dates: {IBIT: "2024-01-11"}   # CBOE carries pre-launch IBIT bars
  max_gap_days: 30          # a longer gap in the bars = an earlier company on a reused ticker (CEG); dropped
  ladder_spacing_days: 5    # new rung: one 45-day expected move below the last strike, or 5+ trading days later
  call_floor_regimes: [Low, Mid]   # covered-call strike >= net cost per share in these regimes
  circuit_breakers: {half_size_dd: 25, index_only_dd: 40}   # % below the equity peak
  periods:
    "2008": ["2007-10-01", "2009-12-31"]
    "2020": ["2020-02-19", "2020-12-31"]
    "2022": ["2022-01-01", "2022-12-31"]
  windows:
    full:   {start: "2007-01-03", label: "2007 → today"}
    recent: {start: "2021-01-04", label: "2021 → today (whole basket live)"}
  # mode: spike = the rulebook (sell only on qualifying spikes); always = tastytrade-style, a new
  # put every entry_every_days while IVR >= min_ivr; hold = buy-and-hold at weight% (rest in T-bills).
  # Optional per variant: entry_pct (number or {bucket: pct, default: pct}), caps ({total, per_name,
  # <bucket>, <symbol>}: % of account), max_rungs, min_ivr, put_delta / call_delta (fixed or by
  # regime), calls (spike|always), call_coverage (% of shares), call_regimes, dte, decide_dte, vix_caps,
  # roll_itm {puts, calls, max_rolls, dte, call_regimes}, start (later window start for this variant).
  target:                   # defaults for mode: target variants (vol_wheel/target.py)
    band_pct: 5             # act when shares are this far (% of the account) from the target
    slice_pct: 10           # each put/call slice (or no limit for stock) covers up to 10% of the account
    every_days: 5           # one new slice per side per 5 sessions, plus one on any spike day
    dte: 45
    stock_cost_bps: 5       # stock execution: cost per trade (bps of notional)
    high_lookback_days: null   # drawdown measured from the all-time high (or a rolling window)
  pmcc:                     # defaults for mode: pmcc variants (vol_wheel/pmcc.py)
    exposure_pct: 100       # long-leg notional (shares controlled x price) as % of the account
    leap_delta: 85
    leap_dte: 365
    leap_exit_dte: 120      # close the LEAP (and reopen) at 120 DTE, as in the rulebook
    slippage_pct_leap: 1.0  # % of the LEAP's mid per fill
    ema_fast: 8
    ema_slow: 21
    neutral_band_pct: 0.5   # |EMA8/EMA21 - 1| below this = neutral
    rsi_n: 14
    rsi_min: 35
    trend_call_delta: {up: 25, neutral: 50, down: 65}
    call_dte: 10            # 1-2 week calls
    roll_at_captured_pct: 85   # buy back once 85% of the extrinsic is captured (or the day before expiry)
    call_coverage: 100
    weekly_iv_ratio: 1.0    # short-call IV = this x the 30-day IV (VXN-based); < 1 = calm-market term structure
  variants:
    - {name: qqq_spike, label: "QQQ only · spikes", symbols: [QQQ], mode: spike, entry_pct: 15,
       caps: {total: 80, per_name: 80, Index: 80}}
    - {name: qqq_spike_cc, label: "QQQ only · spike puts, calls always on shares", symbols: [QQQ], mode: spike,
       entry_pct: 15, calls: always, caps: {total: 80, per_name: 80, Index: 80}}
    # Scale in / scale out (Jordan, 2026-10-11): stay deployed, puts on the cash and calls on the
    # shares at all times; regime deltas lean in at lows (30Δ puts / 10Δ calls) and out at highs
    # (10Δ puts / 30Δ calls), so assignments ladder into shares on the way down and out on the way up.
    - {name: qqq_scale, label: "QQQ scale in/out · cap 80%", symbols: [QQQ], mode: always, entry_pct: 10,
       entry_every_days: 2, min_ivr: 0, caps: {total: 80, per_name: 80, Index: 80}}
    - {name: qqq_scale_vix, label: "QQQ scale in/out · VIX-scaled cap", symbols: [QQQ], mode: always, entry_pct: 10,
       entry_every_days: 2, min_ivr: 0, vix_caps: true, caps: {total: 80, per_name: 80, Index: 80}}
    - {name: qqq_scale_vix100, label: "QQQ scale in/out · VIX cap to 100%", symbols: [QQQ], mode: always,
       entry_pct: 10, entry_every_days: 2, min_ivr: 0, vix_caps: [[0, 50], [15, 65], [20, 80], [30, 90], [40, 100]],
       caps: {total: 100, per_name: 100, Index: 100}}
    - {name: qqq_scale_lows, label: "QQQ scale in/out · VIX cap · 40Δ puts at lows", symbols: [QQQ], mode: always,
       entry_pct: 10, entry_every_days: 2, min_ivr: 0, vix_caps: true, put_delta: {Low: 40, Mid: 20, High: 10},
       caps: {total: 80, per_name: 80, Index: 80}}
    - {name: qqq_scale_ivr30, label: "QQQ scale in/out · VIX cap · puts only at IVR ≥ 30", symbols: [QQQ],
       mode: always, entry_pct: 10, entry_every_days: 2, min_ivr: 30, vix_caps: true,
       caps: {total: 80, per_name: 80, Index: 80}}
    # Which side costs the return? Same always-on puts, different call policies.
    - {name: qqq_puts_hold, label: "QQQ puts always on · calls only on up-spikes", symbols: [QQQ], mode: always,
       entry_pct: 10, entry_every_days: 2, min_ivr: 0, vix_caps: true, calls: spike,
       caps: {total: 80, per_name: 80, Index: 80}}
    - {name: qqq_scale_half, label: "QQQ scale in/out · calls on half the shares", symbols: [QQQ], mode: always,
       entry_pct: 10, entry_every_days: 2, min_ivr: 0, vix_caps: true, call_coverage: 50,
       caps: {total: 80, per_name: 80, Index: 80}}
    - {name: qqq_scale_high, label: "QQQ scale in/out · calls only in High regime", symbols: [QQQ], mode: always,
       entry_pct: 10, entry_every_days: 2, min_ivr: 0, vix_caps: true, call_regimes: [High],
       caps: {total: 80, per_name: 80, Index: 80}}
    # Jordan 2026-10-11: TA-style strikes and "roll until you're right" (Soliel). roll_itm rolls an ITM
    # option at the 21-DTE decision to roll_itm.dte days out at the best strike that still nets a
    # credit (puts down, calls up), up to max_rolls; call_regimes limits call rolls to those regimes.
    - {name: qqq_roll_both, label: "QQQ puts+calls always · roll ITM both sides for credit", symbols: [QQQ],
       mode: always, entry_pct: 10, entry_every_days: 2, min_ivr: 0, vix_caps: true,
       roll_itm: {puts: true, calls: true, max_rolls: 8, dte: 45}, caps: {total: 80, per_name: 80, Index: 80}}
    - {name: qqq_calls_top, label: "QQQ puts always · 5–10Δ calls rolled up, assigned only in High regime",
       symbols: [QQQ], mode: always, entry_pct: 10, entry_every_days: 2, min_ivr: 0, vix_caps: true,
       call_delta: {Low: 5, Mid: 10, High: 30}, roll_itm: {calls: true, call_regimes: [Low, Mid], max_rolls: 8, dte: 45},
       caps: {total: 80, per_name: 80, Index: 80}}
    - {name: qqq_lows_short, label: "QQQ puts always · 21-DTE 40Δ puts at lows · calls on up-spikes", symbols: [QQQ],
       mode: always, entry_pct: 10, entry_every_days: 2, min_ivr: 0, vix_caps: true, calls: spike,
       dte: {Low: 21}, put_delta: {Low: 40, Mid: 20, High: 10}, caps: {total: 80, per_name: 80, Index: 80}}
    # MSTR only, from its bitcoin-treasury era (Aug 2020). Soliel-style: heavy puts at lows, far-OTM calls
    # rolled up and out to avoid assignment except near tops (High regime). Single-stock IV is modelled
    # (stock_iv_mults sensitivity); momentum rule keeps calls on <= 50% of shares.
    - {name: mstr_hold, label: "MSTR · buy & hold 80%", symbols: [MSTR], mode: hold, weight: 80, start: "2020-09-01"}
    - {name: mstr_spike, label: "MSTR · spikes (current rules)", symbols: [MSTR], mode: spike, entry_pct: 15,
       start: "2020-09-01", caps: {total: 80, per_name: 80, Crypto: 80}}
    - {name: mstr_puts_hold, label: "MSTR · puts always · calls on up-spikes", symbols: [MSTR], mode: always,
       entry_pct: 10, entry_every_days: 2, min_ivr: 0, calls: spike, start: "2020-09-01",
       caps: {total: 80, per_name: 80, Crypto: 80}}
    # Nithu Sezni ("Soliel", The Orange Pill Investor) per his X posts: calls only after a rally with IVR > 50,
    # ~20% above the price, rolled on Fridays; called away when a surge makes rolling unaffordable.
    - {name: mstr_nithu, label: "MSTR · Nithu's posted rule (calls after rallies, ~20Δ, rolled up)", symbols: [MSTR],
       mode: always, entry_pct: 10, entry_every_days: 2, min_ivr: 0, calls: spike, call_delta: 20,
       roll_itm: {calls: true, max_rolls: 8, dte: 45}, start: "2020-09-01", caps: {total: 80, per_name: 80, Crypto: 80}}
    - {name: mstr_soliel, label: "MSTR · as described (40Δ puts at lows, calls rolled up until tops)",
       symbols: [MSTR], mode: always, entry_pct: 10, entry_every_days: 2, min_ivr: 0, start: "2020-09-01",
       put_delta: {Low: 40, Mid: 25, High: 15}, call_delta: {Low: 5, Mid: 10, High: 30},
       roll_itm: {calls: true, call_regimes: [Low, Mid], max_rolls: 8, dte: 45},
       caps: {total: 80, per_name: 80, Crypto: 80}}
    - {name: mstr_soliel_rollputs, label: "MSTR · as described + puts rolled down & out", symbols: [MSTR],
       mode: always, entry_pct: 10, entry_every_days: 2, min_ivr: 0, start: "2020-09-01",
       put_delta: {Low: 40, Mid: 25, High: 15}, call_delta: {Low: 5, Mid: 10, High: 30},
       roll_itm: {puts: true, calls: true, call_regimes: [Low, Mid], max_rolls: 8, dte: 45},
       caps: {total: 80, per_name: 80, Crypto: 80}}
    # Target allocation by drawdown (Jordan 2026-10-12): mostly cash near highs, mostly shares deep in a
    # drawdown, reached with laddered puts/calls (options) or by trading the stock (stock), same rule.
    - {name: qqq_target_opts, label: "QQQ target 40%→100% shares by drawdown · via options", symbols: [QQQ],
       mode: target, exec: options, alloc: [[0, 40], [10, 55], [20, 70], [30, 80], [50, 100]]}
    - {name: qqq_target_stock, label: "QQQ target 40%→100% shares by drawdown · via stock", symbols: [QQQ],
