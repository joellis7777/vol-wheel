    - {name: qg_x_states, label: "QQQ / GLD / XLE 45/45/10 · daily 3-state (2007→, no bitcoin)", mode: hold,
       symbols: [QQQ, GLD, XLE], weights: {QQQ: 45, GLD: 45, XLE: 10}, states: {}}
    - {name: qg_x_combo, label: "QQQ / GLD / XLE 45/45/10 · monthly falling exits (2007→)", mode: hold,
       symbols: [QQQ, GLD, XLE], weights: {QQQ: 45, GLD: 45, XLE: 10}, trend_sma: 200, trend_falling: true}
    # Hybrid: daily 3-state signal on bitcoin only (fast crashes), monthly falling-200 exits on the rest.
    - {name: btc_states, label: "BTC · daily 3-state signal", mode: hold, symbols: [BTC-USD], states: {}, start: "2015-10-01"}
    - {name: qgx_falling, label: "QQQ / GLD / XLE 3/3/1 · monthly falling exits", mode: hold, symbols: [QQQ, GLD, XLE],
       weights: {QQQ: 30, GLD: 30, XLE: 10}, trend_sma: 200, trend_falling: true}
    - {name: core_hybrid, label: "Core 30/30/30/10 · BTC daily 3-state, QQQ/GLD/XLE monthly falling exits", mode: blend,
       weights: {qgx_falling: 70, btc_states: 30}, start: "2015-10-01"}
    - {name: core_hybrid20, label: "Core 35/35/20/10 · hybrid exits (BTC daily, rest monthly)", mode: blend,
       weights: {qgx_falling: 80, btc_states: 20}, start: "2015-10-01"}
    # Where MSTR premium goes (2026-10-11): 30-delta puts ~45 DTE, a new one every 5 sessions, 10% notional each,
    # close at 50% or 21 DTE, never assigned. Premium/yr vs the net return shows the losses that offset it.
    - {name: mstr_csp30, label: "MSTR · 30Δ puts, close 50% / 21 DTE, never assigned", symbols: [MSTR], mode: always,
       put_delta: 30, entry_pct: 10, entry_every_days: 5, min_ivr: 0, calls: none, decide_itm: close,
       start: "2020-09-01", caps: {total: 80, per_name: 80, Crypto: 80}}
    - {name: mstr_csp20, label: "MSTR · 20Δ puts, close 50% / 21 DTE, never assigned", symbols: [MSTR], mode: always,
       put_delta: 20, entry_pct: 10, entry_every_days: 5, min_ivr: 0, calls: none, decide_itm: close,
       start: "2020-09-01", caps: {total: 80, per_name: 80, Crypto: 80}}
    - {name: mstr_csp30_full, label: "MSTR · 30Δ puts, close 50% / 21 DTE · kept fully deployed (new put every session)",
       symbols: [MSTR], mode: always, put_delta: 30, entry_pct: 20, entry_every_days: 1, min_ivr: 0, calls: none,
       decide_itm: close, start: "2020-09-01", caps: {total: 80, per_name: 80, Crypto: 80}}
    # Convexity sleeve beyond MSTR (2026-10-11): same rules (15Δ / 40Δ, no filter, half at +100%, 60Δ / 90 DTE)
    # on other volatile names; BTC-USD has no listed options before 2024, so it's a modelled what-if.
    - {name: tsla_sleeve15, label: "TSLA sleeve · 15Δ, no filter", symbols: [TSLA], mode: sleeve, entry_delta: 15,
       entry_filter: [], max_runup_pct: null, start: "2012-01-01"}
    - {name: tsla_sleeve40, label: "TSLA sleeve · 40Δ, no filter", symbols: [TSLA], mode: sleeve, entry_delta: 40,
       entry_filter: [], max_runup_pct: null, start: "2012-01-01"}
    - {name: tsla_shares5, label: "TSLA · 5% in shares", symbols: [TSLA], mode: hold, weight: 5, start: "2012-01-01"}
    - {name: nvda_sleeve15, label: "NVDA sleeve · 15Δ, no filter", symbols: [NVDA], mode: sleeve, entry_delta: 15,
       entry_filter: [], max_runup_pct: null}
    - {name: nvda_sleeve40, label: "NVDA sleeve · 40Δ, no filter", symbols: [NVDA], mode: sleeve, entry_delta: 40,
       entry_filter: [], max_runup_pct: null}
    - {name: nvda_shares5, label: "NVDA · 5% in shares", symbols: [NVDA], mode: hold, weight: 5}
    - {name: btc_sleeve15, label: "BTC sleeve · 15Δ, no filter (modelled)", symbols: [BTC-USD], mode: sleeve,
       entry_delta: 15, entry_filter: [], max_runup_pct: null, start: "2015-10-01"}
    - {name: btc_sleeve40, label: "BTC sleeve · 40Δ, no filter (modelled)", symbols: [BTC-USD], mode: sleeve,
       entry_delta: 40, entry_filter: [], max_runup_pct: null, start: "2015-10-01"}
    - {name: btc_shares5, label: "BTC · 5% held", symbols: [BTC-USD], mode: hold, weight: 5, start: "2015-10-01"}
    - {name: qqq_sleeve15, label: "QQQ sleeve · 15Δ, no filter", symbols: [QQQ], mode: sleeve, entry_delta: 15,
       entry_filter: [], max_runup_pct: null}
    - {name: qqq_sleeve40, label: "QQQ sleeve · 40Δ, no filter", symbols: [QQQ], mode: sleeve, entry_delta: 40,
       entry_filter: [], max_runup_pct: null}
    - {name: qqq_shares5, label: "QQQ · 5% in shares", symbols: [QQQ], mode: hold, weight: 5}
    # Term-structure check: price the long-dated calls at 1.2x the 30-day IV (LEAP IV runs above 30-day in calm markets).
    - {name: qqq_sleeve15_iv12, label: "QQQ sleeve · 15Δ, LEAP IV 1.2x", symbols: [QQQ], mode: sleeve, entry_delta: 15,
       entry_filter: [], max_runup_pct: null, iv_scale: 1.2}
    - {name: mstr_sleeve15_iv12, label: "MSTR sleeve · 15Δ no filter, LEAP IV 1.2x", symbols: [MSTR], mode: sleeve,
       entry_delta: 15, entry_filter: [], max_runup_pct: null, iv_scale: 1.2, start: "2020-09-01"}
    - {name: nvda_sleeve15_iv12, label: "NVDA sleeve · 15Δ, LEAP IV 1.2x", symbols: [NVDA], mode: sleeve, entry_delta: 15,
       entry_filter: [], max_runup_pct: null, iv_scale: 1.2}
    - {name: qqq_sleeve40_iv12, label: "QQQ sleeve · 40Δ, LEAP IV 1.2x", symbols: [QQQ], mode: sleeve, entry_delta: 40,
       entry_filter: [], max_runup_pct: null, iv_scale: 1.2}
    # Start small, scale in (Jordan 2026-10-11, tastytrade's "start small so you can keep adding"): each new put's
    # size x a multiplier by the name's drawdown from its 1-year high (`size_by_dd`), same total caps as the flat
    # versions. Controls: the same book at the small starting size, flat.
    - {name: qqq_puts_small, label: "QQQ puts always + spike calls · small flat 3% puts", symbols: [QQQ], mode: always,
       entry_pct: 3, entry_every_days: 2, min_ivr: 0, vix_caps: true, calls: spike, caps: {total: 80, per_name: 80, Index: 80}}
    - {name: qqq_puts_scalein, label: "QQQ puts always + spike calls · 3% at highs → 15% at −20%", symbols: [QQQ],
       mode: always, entry_pct: 3, entry_every_days: 2, min_ivr: 0, vix_caps: true, calls: spike,
       size_by_dd: [[0, 1], [5, 2], [10, 3], [20, 5]], caps: {total: 80, per_name: 80, Index: 80}}
    - {name: qqq_puts_scalein_steep, label: "QQQ puts always + spike calls · 2% at highs → 20% at −30%", symbols: [QQQ],
       mode: always, entry_pct: 2, entry_every_days: 2, min_ivr: 0, vix_caps: true, calls: spike,
       size_by_dd: [[0, 1], [10, 3], [20, 6], [30, 10]], caps: {total: 80, per_name: 80, Index: 80}}
    - {name: tasty_wheel_scalein, label: "6-ETF wheel · 2% puts at highs → 8% at −20%", symbols: [SPY, QQQ, IWM, GLD, TLT, XLE],
       mode: always, put_delta: 16, entry_pct: 2, entry_every_days: 5, min_ivr: 0, calls: spike, vix_caps: true,
       size_by_dd: [[0, 1], [5, 2], [10, 3], [20, 4]], caps: {total: 80, per_name: 25, Index: 50}}
    - {name: tasty_csp_scalein, label: "tastytrade book (never assigned) · 2% puts at highs → 8% at −20%",
       symbols: [SPY, QQQ, IWM, GLD, TLT, XLE], mode: always, put_delta: 16, entry_pct: 2, entry_every_days: 5,
       min_ivr: 0, calls: none, decide_itm: close, take_profit_pct: 50, vix_caps: true,
       size_by_dd: [[0, 1], [5, 2], [10, 3], [20, 4]], caps: {total: 80, per_name: 25, Index: 50}}
    - {name: mstr_puts_scalein, label: "MSTR puts always + spike calls · 3% at highs → 15% at −60%", symbols: [MSTR],
       mode: always, entry_pct: 3, entry_every_days: 2, min_ivr: 0, calls: spike, start: "2020-09-01",
       size_by_dd: [[0, 1], [20, 2], [40, 3], [60, 5]], caps: {total: 80, per_name: 80, Crypto: 80}}
    # Pyramiding by total exposure into high-conviction assets (Jordan 2026-10-11): hold back a reserve at the high,
    # buy more of the asset the further it falls (stock), trim back toward the base weight as it recovers to new
    # highs. mode: target, exec: stock; alloc = [[drawdown % from the all-time high, % of the sleeve invested]].
    - {name: qqq_pyr, label: "QQQ pyramid · 80% at the high → 100% at −30%", symbols: [QQQ], mode: target, exec: stock,
       alloc: [[0, 80], [10, 87], [20, 94], [30, 100]]}
    - {name: qqq_pyr_steep, label: "QQQ pyramid · 60% at the high → 100% at −30%", symbols: [QQQ], mode: target,
       exec: stock, alloc: [[0, 60], [10, 75], [20, 90], [30, 100]]}
    - {name: qqq_pyr_trend, label: "QQQ pyramid 80→100% · capped at 50% below a falling 200-day", symbols: [QQQ],
       mode: target, exec: stock, alloc: [[0, 80], [10, 87], [20, 94], [30, 100]], trend_cap_pct: 50}
    - {name: gld_pyr, label: "GLD pyramid · 80% → 100% at −30%", symbols: [GLD], mode: target, exec: stock,
       alloc: [[0, 80], [10, 87], [20, 94], [30, 100]]}
    - {name: xle_pyr, label: "XLE pyramid · 80% → 100% at −30%", symbols: [XLE], mode: target, exec: stock,
       alloc: [[0, 80], [10, 87], [20, 94], [30, 100]]}
    - {name: btc_pyr, label: "BTC pyramid · 70% at the high → 100% at −70%", symbols: [BTC-USD], mode: target, exec: stock,
       alloc: [[0, 70], [25, 80], [50, 90], [70, 100]], start: "2015-10-01"}
    - {name: btc_pyr_trend, label: "BTC pyramid 70→100% · capped at 30% below a falling 200-day", symbols: [BTC-USD],
       mode: target, exec: stock, alloc: [[0, 70], [25, 80], [50, 90], [70, 100]], trend_cap_pct: 30, start: "2015-10-01"}
    - {name: btc_hold_80, label: "BTC 80% held / 20% T-bills", symbols: [BTC-USD], mode: hold, weight: 80, start: "2015-10-01"}
    - {name: core_btc20_hold, label: "Core 35/35/20/10 · held, monthly rebalance, no exits", mode: hold,
       symbols: [QQQ, GLD, BTC-USD, XLE], weights: {QQQ: 35, GLD: 35, BTC-USD: 20, XLE: 10}, start: "2015-10-01"}
    - {name: core_btc20_80, label: "Core 35/35/20/10 · 80% invested, 20% T-bills, no exits", mode: hold,
       symbols: [QQQ, GLD, BTC-USD, XLE], weights: {QQQ: 35, GLD: 35, BTC-USD: 20, XLE: 10}, weight: 80,
       start: "2015-10-01"}
    - {name: core_pyr, label: "Core 35/35/20/10 · each sleeve pyramids into its own drawdown (80/70% at highs)",
       mode: blend, weights: {qqq_pyr: 35, gld_pyr: 35, btc_pyr: 20, xle_pyr: 10}, start: "2015-10-01"}
    - {name: core_pyr_trend, label: "Core 35/35/20/10 · pyramids, QQQ and BTC capped below a falling 200-day",
       mode: blend, weights: {qqq_pyr_trend: 35, gld_pyr: 35, btc_pyr_trend: 20, xle_pyr: 10}, start: "2015-10-01"}
    # Pyramid into dips only while the trend holds; out (0%) below a falling 200-day.
    - {name: qqq_pyr_exit, label: "QQQ pyramid 80→100% in uptrends · out below a falling 200-day", symbols: [QQQ],
       mode: target, exec: stock, alloc: [[0, 80], [10, 87], [20, 94], [30, 100]], trend_cap_pct: 0}
    - {name: gld_pyr_exit, label: "GLD pyramid 80→100% · out below a falling 200-day", symbols: [GLD], mode: target,
       exec: stock, alloc: [[0, 80], [10, 87], [20, 94], [30, 100]], trend_cap_pct: 0}
    - {name: xle_pyr_exit, label: "XLE pyramid 80→100% · out below a falling 200-day", symbols: [XLE], mode: target,
       exec: stock, alloc: [[0, 80], [10, 87], [20, 94], [30, 100]], trend_cap_pct: 0}
    - {name: btc_pyr_exit, label: "BTC pyramid 70→100% · out below a falling 200-day", symbols: [BTC-USD], mode: target,
       exec: stock, alloc: [[0, 70], [25, 80], [50, 90], [70, 100]], trend_cap_pct: 0, start: "2015-10-01"}
    - {name: core_pyr_exit, label: "Core 35/35/20/10 · pyramid dips in uptrends, out below a falling 200-day",
       mode: blend, weights: {qqq_pyr_exit: 35, gld_pyr_exit: 35, btc_pyr_exit: 20, xle_pyr_exit: 10}, start: "2015-10-01"}
    - {name: core_combo_80, label: "Account 80% core (combo exits) + 20% T-bills reserve, never deployed", mode: blend,
       weights: {core_btc20_combo: 80, tbills: 20}, start: "2015-10-01"}
    - {name: qqq_trend_80, label: "80% QQQ falling-200 exit + 20% T-bills reserve, never deployed", mode: blend,
       weights: {qqq_trend_falling: 80, tbills: 20}}
    # Per-ticker pyramid ranges calibrated to each asset's history (Jordan 2026-10-11: no trend exit; fully invested
    # only near its historical worst drawdown). Worst drawdowns in our data: QQQ −54% (2008; −83% in 2000–02, before
    # the data), GLD −46%, BTC −83%, XLE −82% (price only, no dividends).
    - {name: qqq_pyr_cal55, label: "QQQ pyramid 80% → 100% at −55% (worst in data)", symbols: [QQQ], mode: target,
       exec: stock, alloc: [[0, 80], [15, 85], [30, 90], [45, 95], [55, 100]]}
    - {name: qqq_pyr_cal80, label: "QQQ pyramid 80% → 100% at −80% (2000-02 crash)", symbols: [QQQ], mode: target,
       exec: stock, alloc: [[0, 80], [20, 85], [40, 90], [60, 95], [80, 100]]}
    - {name: gld_pyr_cal, label: "GLD pyramid 80% → 100% at −45%", symbols: [GLD], mode: target, exec: stock,
       alloc: [[0, 80], [15, 87], [30, 94], [45, 100]]}
    - {name: btc_pyr_cal, label: "BTC pyramid 70% → 100% at −80%", symbols: [BTC-USD], mode: target, exec: stock,
       alloc: [[0, 70], [25, 78], [50, 86], [80, 100]], start: "2015-10-01"}
    - {name: xle_pyr_cal, label: "XLE pyramid 80% → 100% at −75%", symbols: [XLE], mode: target, exec: stock,
       alloc: [[0, 80], [25, 87], [50, 94], [75, 100]]}
    - {name: core_pyr_cal55, label: "Core 35/35/20/10 · per-ticker pyramid ranges, no exits (QQQ full at −55%)",
       mode: blend, weights: {qqq_pyr_cal55: 35, gld_pyr_cal: 35, btc_pyr_cal: 20, xle_pyr_cal: 10}, start: "2015-10-01"}
    - {name: core_pyr_cal80, label: "Core 35/35/20/10 · per-ticker pyramid ranges, no exits (QQQ full at −80%)",
       mode: blend, weights: {qqq_pyr_cal80: 35, gld_pyr_cal: 35, btc_pyr_cal: 20, xle_pyr_cal: 10}, start: "2015-10-01"}
    # Jordan's full plan (2026-10-11): pyramid in as it falls (per-ticker ranges) AND scale out as the bull matures
    # (calls assigned higher and higher), so the account is light going into the next bear. alloc_gain caps the
    # share % by the gain from the 3-year low (gain_lookback_days 756). exec options = puts on the shortfall,
    # calls on the excess (assignment does the selling); exec stock = same targets traded directly.
    - {name: qqq_cycle, label: "QQQ cycle · pyramid to −80% + scale out to 40% at +200% off the 3y low · stock", symbols: [QQQ],
       mode: target, exec: stock, alloc: [[0, 80], [20, 85], [40, 90], [60, 95], [80, 100]],
       alloc_gain: [[0, 100], [50, 90], [100, 70], [150, 50], [200, 40]]}
    - {name: qqq_cycle_opts, label: "QQQ cycle · same targets via puts / assigned calls", symbols: [QQQ], mode: target,
       exec: options, alloc: [[0, 80], [20, 85], [40, 90], [60, 95], [80, 100]],
       alloc_gain: [[0, 100], [50, 90], [100, 70], [150, 50], [200, 40]]}
    - {name: gld_cycle, label: "GLD cycle · pyramid to −45% + scale out to 50% at +150%", symbols: [GLD], mode: target,
       exec: stock, alloc: [[0, 80], [15, 87], [30, 94], [45, 100]], alloc_gain: [[0, 100], [50, 90], [100, 70], [150, 50]]}
    - {name: gld_cycle_opts, label: "GLD cycle · via options", symbols: [GLD], mode: target, exec: options,
       alloc: [[0, 80], [15, 87], [30, 94], [45, 100]], alloc_gain: [[0, 100], [50, 90], [100, 70], [150, 50]]}
    - {name: xle_cycle, label: "XLE cycle · pyramid to −75% + scale out to 50% at +150%", symbols: [XLE], mode: target,
       exec: stock, alloc: [[0, 80], [25, 87], [50, 94], [75, 100]], alloc_gain: [[0, 100], [50, 90], [100, 70], [150, 50]]}
    - {name: xle_cycle_opts, label: "XLE cycle · via options", symbols: [XLE], mode: target, exec: options,
       alloc: [[0, 80], [25, 87], [50, 94], [75, 100]], alloc_gain: [[0, 100], [50, 90], [100, 70], [150, 50]]}
    - {name: btc_cycle, label: "BTC cycle · pyramid to −80% + scale out to 30% at +1500% off the 3y low", symbols: [BTC-USD],
       mode: target, exec: stock, alloc: [[0, 70], [25, 78], [50, 86], [80, 100]],
       alloc_gain: [[0, 100], [200, 85], [400, 65], [800, 45], [1500, 30]], start: "2015-10-01"}
    - {name: btc_cycle_opts, label: "BTC cycle · via options (modelled)", symbols: [BTC-USD], mode: target, exec: options,
       alloc: [[0, 70], [25, 78], [50, 86], [80, 100]], alloc_gain: [[0, 100], [200, 85], [400, 65], [800, 45], [1500, 30]],
       index: false, start: "2015-10-01"}
    - {name: core_cycle, label: "Core 35/35/20/10 · pyramid in + scale out (stock)", mode: blend,
       weights: {qqq_cycle: 35, gld_cycle: 35, btc_cycle: 20, xle_cycle: 10}, start: "2015-10-01"}
    - {name: core_cycle_opts, label: "Core 35/35/20/10 · pyramid in + scale out via puts / assigned calls", mode: blend,
       weights: {qqq_cycle_opts: 35, gld_cycle_opts: 35, btc_cycle_opts: 20, xle_cycle_opts: 10}, start: "2015-10-01"}
